[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retry-aware-eval"
version = "0.1.0"
description = "Auditable retry-aware solver/verifier experiments over OpenRouter"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

